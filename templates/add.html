{% extends "base.html" %}
{% block title %}Add Food Item - Food Waste Reducer{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <h1><i class="fas fa-plus-circle" style="color: var(--primary);"></i> Add Food Item</h1>
        <p>Add a new item to your food inventory</p>
    </div>
</div>

<div class="card" style="max-width: 700px;">
    <form action="/add" method="POST">
        <div class="form-group">
            <label for="name">Food Name *</label>
            <input type="text" id="name" name="name" placeholder="e.g., Milk, Chicken Breast, Apples" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="category">Category *</label>
                <select id="category" name="category" required>
                    {% for cat in categories %}
                    <option value="{{ cat.name }}">{{ cat.name }} ({{ cat.default_shelf_life_days }} days shelf life)</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="storage">Storage Location</label>
                <select id="storage" name="storage">
                    <option value="fridge">Fridge</option>
                    <option value="freezer">Freezer</option>
                    <option value="pantry">Pantry</option>
                    <option value="counter">Counter</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="purchase_date">Purchase Date *</label>
                <input type="date" id="purchase_date" name="purchase_date" value="{{ today }}" required>
            </div>
            <div class="form-group">
                <label for="expiry_date">Expiry Date *</label>
                <input type="date" id="expiry_date" name="expiry_date" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="quantity">Quantity</label>
                <input type="number" id="quantity" name="quantity" value="1" min="0.1" step="0.1">
            </div>
            <div class="form-group">
                <label for="unit">Unit</label>
                <select id="unit" name="unit">
                    <option value="pcs">Pieces</option>
                    <option value="kg">Kilograms</option>
                    <option value="g">Grams</option>
                    <option value="L">Liters</option>
                    <option value="ml">Milliliters</option>
                    <option value="oz">Ounces</option>
                    <option value="lb">Pounds</option>
                    <option value="pack">Pack</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label for="notes">Notes (optional)</label>
            <textarea id="notes" name="notes" rows="3" placeholder="Any additional notes about this item..."></textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary"><i class="fas fa-plus"></i> Add Item</button>
            <a href="/" class="btn btn-outline">Cancel</a>
        </div>
    </form>
</div>

<script>
document.getElementById('category').addEventListener('change', function() {
    const option = this.options[this.selectedIndex];
    const match = option.text.match(/\((\d+) days/);
    if (match) {
        const shelfLife = parseInt(match[1]);
        const purchase = new Date(document.getElementById('purchase_date').value);
        purchase.setDate(purchase.getDate() + shelfLife);
        document.getElementById('expiry_date').value = purchase.toISOString().split('T')[0];
    }
});

document.getElementById('purchase_date').addEventListener('change', function() {
    const option = document.getElementById('category').options[document.getElementById('category').selectedIndex];
    const match = option.text.match(/\((\d+) days/);
    if (match) {
        const shelfLife = parseInt(match[1]);
        const purchase = new Date(this.value);
        purchase.setDate(purchase.getDate() + shelfLife);
        document.getElementById('expiry_date').value = purchase.toISOString().split('T')[0];
    }
});

document.getElementById('category').dispatchEvent(new Event('change'));
</script>
{% endblock %}
